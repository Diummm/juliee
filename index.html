<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Moving I Love You Heart</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  background:#000;
  display:grid;
  place-items:center;
  font-family:Arial,Helvetica,sans-serif;
}
#ui{
  position:relative;
  width:min(92vw,700px);
  height:min(92vw,700px);
}

.glow{
  position:absolute;
  left:50%;top:50%;
  width:330px;height:300px;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(255,20,147,.20),transparent 68%);
  filter:blur(18px);
  animation:pulse 1.4s ease-in-out infinite;
}


.heart{
  position:absolute;
  left:50%;top:50%;
  width:210px;height:190px;
  transform:translate(-50%,-42%) rotate(-45deg);
  background:#ff1493;
  border-radius:28px;
  filter:drop-shadow(0 0 10px #ff1493)
         drop-shadow(0 0 30px rgba(255,20,147,.9))
         drop-shadow(0 0 65px rgba(255,20,147,.45));
  animation:heartBeat 1.25s ease-in-out infinite;
}
.heart:before,.heart:after{
  content:"";
  position:absolute;
  width:210px;height:190px;
  background:#ff1493;
  border-radius:50%;
}
.heart:before{left:0;top:-95px}
.heart:after{left:105px;top:0}

.word{
  position:absolute;
  left:0;top:0;
  color:#ffb6dc;
  font-size:clamp(11px,1.75vw,15px);
  font-weight:700;
  letter-spacing:.1px;
  white-space:nowrap;
  text-shadow:0 0 2px rgba(255,255,255,.8), 0 0 5px rgba(255,20,147,.75);
  will-change:transform;
  user-select:none;
}

@keyframes heartBeat{
  0%,100%{transform:translate(-50%,-42%) rotate(-45deg) scale(1)}
  50%{transform:translate(-50%,-42%) rotate(-45deg) scale(1.055)}
}
@keyframes pulse{
  0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.95)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
}
</style>
</head>
<body>
<div id="ui">
  <div class="glow"></div>
  <div class="heart"></div>
</div>

<script>
const ui = document.getElementById("ui");



const COUNT = 50;
const words = [];

for (let i = 0; i < COUNT; i++) {
  const el = document.createElement("div");
  el.className = "word";
  el.textContent = "Julie";
  ui.appendChild(el);
  words.push({
    el,
    offset: i / COUNT,
    speed: 0.028 + (i % 5) * 0.0012
  });
}

function heartPoint(t, scale, cx, cy) {
  const x = 16 * Math.sin(t) ** 3;
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2*t)
          - 2 * Math.cos(3*t)
          - Math.cos(4*t);

  return {
    x: cx + x * scale,
    y: cy - y * scale
  };
}

function animate(time) {
  const w = ui.clientWidth;
  const h = ui.clientHeight;

  const cx = w / 2;
  const cy = h / 2 + 5;
  const scale = Math.min(w, h) / 30;

  const seconds = time / 1000;

  words.forEach((item) => {
    const t = ((seconds * item.speed + item.offset) % 1) * Math.PI * 2;

    const p = heartPoint(t, scale, cx, cy);

    const dt = 0.003;
    const p2 = heartPoint(t + dt, scale, cx, cy);
    const angle = Math.atan2(p2.y - p.y, p2.x - p.x) * 180 / Math.PI;

    const bob = Math.sin(seconds * 2 + item.offset * 20) * 1.5;

    item.el.style.transform =
      `translate(${p.x}px,${p.y + bob}px) translate(-50%,-50%) rotate(${angle}deg)`;
  });

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
